# nginx in front of the FastAPI app. It terminates TLS for the app on the
# inner hop — the ALB is still the *outermost* terminator (plan 05 topology:
# outermost wins, the inner one is recorded as `upstream_owner`).
worker_processes auto;

server {
    listen 8000 ssl;
    server_name payments.internal;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://localhost:8000;
    }
}
