# pqmap curated crypto-capability matrix (plan 03)
# --------------------------------------------------
# This file is THE load-bearing asset. Every row MUST carry `source_url` +
# `as_of` (provenance). A row whose `as_of` is stale or whose `source_url` is
# unreachable resolves to `pq-unknown` (never a stale `true`) — plan 03.
#
# Tri-state: `pq_kem = true` → capable, `pq_kem = false` → unavailable,
# `pq_kem_unknown = true` → unknown (prefer over guessing). `verified = true`
# rows are human-approved and not downgraded by the drift job.
# Adding a framework = adding rows (data, not code).

