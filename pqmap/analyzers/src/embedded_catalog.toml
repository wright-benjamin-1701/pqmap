# Framework API catalog (plan 02): data, not code.
# Each row is a call-site matcher. Adding a framework = adding rows.
#
# Pattern is a Rust regex (Rust `regex` crate). Match against a *line*.
#
# Confidence: `literal` 0.9, `alias` 0.75, `subclass` 0.7, `di` 0.7.
# Base rows are `literal`; alias/subclass/di patterns are matched separately
# by the pipeline and *add* confidence via the resolution chain.

