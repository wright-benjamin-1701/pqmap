[workspace]
resolver = "2"
members = ["core", "kb", "analyzers", "scoring", "probe", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["pqmap"]
repository = "https://github.com/pqc-app/pqmap"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
semver = "1"
regex = "1"
toml = "0.9"
rayon = "1"
rustls-pki-types = "1"
x509-cert = "0.3"

[profile.dev]
opt-level = 1
